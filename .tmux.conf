# ---------------------------------------------------
# 端末・カラー設定 (True Color対応)
# ---------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"

# prefixキーを C-a に変更
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 番号基準値を1に変更
set -g base-index 1
setw -g pane-base-index 1

# マウス操作を有効化
set -g mouse on

# ---------------------------------------------------
# ステータスバー設定
# ---------------------------------------------------
set -g status-position top
set -g status-interval 1
set -g status-justify centre

set -g status-left-length 90
set -g status-right-length 90

set -g status-left '#H:[#P]'
set -g status-right '#(wifi 2>/dev/null) #(battery --tmux 2>/dev/null) [%Y-%m-%d(%a) %H:%M]'

set -g status-bg "colour238"
set -g status-fg "colour255"

# ペインのスタイル設定
set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=colour250,bg=black'
set -g pane-active-border-style bg=black,fg=cyan
set -g pane-border-style bg=black,fg=white

setw -g pane-border-status bottom
setw -g pane-border-format '#{pane_tty} | #{pane_current_path}'

# ---------------------------------------------------
# キーバインド (ペイン移動・分割)
# ---------------------------------------------------
# Vimキーバインドでペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vimキーバインドでペインリサイズ
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ペイン分割 (| と -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---------------------------------------------------
# コピーモード (Vimキーバインド + クリップボード連携)
# ---------------------------------------------------
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Y send -X copy-line

bind C-p paste-buffer

# シェル設定
set -g default-shell "${SHELL}"
set -g default-command "${SHELL}"